<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <title>Site History Tracker - Agent</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --background: #000000;
                --foreground: #fafafa;
                --muted: #18181b;
                --muted-fg: #a1a1aa;
                --border: #27272a;
                --accent: #1d1d20;
                --primary: #fafafa;
                --primary-fg: #18181b;
                --danger: #ef4444;
                --warning: #f59e0b;
                --radius: 8px;
                --font-sans: "Inter", system-ui, sans-serif;
                --font-mono: "JetBrains Mono", monospace;
            }
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                background: var(--background);
                color: var(--foreground);
                font-family: var(--font-sans);
                font-size: 14px;
                height: 100vh;
                display: flex;
                overflow: hidden;
            }

            /* --- Sidebar --- */
            .sidebar {
                width: 260px;
                border-right: 1px solid var(--border);
                display: flex;
                flex-direction: column;
                padding: 24px 12px;
                background: #000;
                -webkit-app-region: drag;
            }
            .logo {
                font-weight: 600;
                font-size: 16px;
                padding: 0 12px 32px;
                display: flex;
                align-items: center;
                gap: 10px;
                -webkit-app-region: no-drag;
            }
            .nav-menu {
                display: flex;
                flex-direction: column;
                gap: 4px;
                -webkit-app-region: no-drag;
            }
            .nav-item {
                padding: 10px 12px;
                border-radius: var(--radius);
                cursor: pointer;
                color: var(--muted-fg);
                font-weight: 500;
                font-size: 13px;
                transition: all 0.2s;
                display: flex;
                align-items: center;
                gap: 10px;
            }
            .nav-item:hover {
                background: var(--accent);
                color: var(--foreground);
            }
            .nav-item.active {
                background: var(--muted);
                color: var(--foreground);
            }
            .ws-status {
                margin-top: auto;
                padding: 12px;
                font-family: var(--font-mono);
                font-size: 11px;
                color: var(--muted-fg);
                display: flex;
                align-items: center;
                gap: 8px;
                -webkit-app-region: no-drag;
            }
            .ws-dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: #3f3f46;
            }
            .ws-dot.on {
                background: #10b981;
                box-shadow: 0 0 8px #10b981;
            }

            /* --- Content --- */
            .main-content {
                flex: 1;
                display: flex;
                flex-direction: column;
                overflow: hidden;
                position: relative;
            }
            .tab-panel {
                display: none;
                padding: 40px;
                height: 100%;
                overflow-y: auto;
            }
            .tab-panel.active {
                display: block;
            }
            h2 {
                font-size: 24px;
                font-weight: 600;
                letter-spacing: -0.05em;
                margin-bottom: 24px;
            }

            /* --- Cards & Metrics --- */
            .grid-metrics {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 16px;
                margin-bottom: 32px;
            }
            .card {
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 20px;
                background: #050505;
            }
            .metric-title {
                font-size: 13px;
                color: var(--muted-fg);
                font-weight: 500;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            .metric-value {
                font-size: 28px;
                font-weight: 600;
                margin-top: 8px;
                font-family: var(--font-mono);
            }

            /* --- History Toolbar --- */
            .toolbar {
                display: flex;
                gap: 12px;
                margin-bottom: 20px;
                align-items: center;
            }
            .search-input {
                flex: 1;
                background: #000;
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 8px 14px;
                color: #fff;
                outline: none;
                font-size: 13px;
            }
            .search-input:focus {
                border-color: var(--muted-fg);
            }
            .filter-bar {
                display: flex;
                gap: 8px;
                overflow-x: auto;
                padding-bottom: 8px;
                margin-bottom: 16px;
            }
            .filter-bar::-webkit-scrollbar {
                height: 0;
            }
            .filter-chip {
                padding: 4px 12px;
                border-radius: 99px;
                border: 1px solid var(--border);
                font-size: 11px;
                cursor: pointer;
                color: var(--muted-fg);
                background: #050505;
                white-space: nowrap;
            }
            .filter-chip.active {
                background: var(--primary);
                color: var(--primary-fg);
                border-color: var(--primary);
            }

            /* --- Data List --- */
            .data-list {
                border: 1px solid var(--border);
                border-radius: var(--radius);
                background: #050505;
            }
            .date-group-header {
                padding: 12px 20px;
                background: #0a0a0a;
                font-size: 11px;
                font-weight: 600;
                color: var(--muted-fg);
                font-family: var(--font-mono);
                border-bottom: 1px solid var(--border);
            }
            .data-item {
                display: flex;
                align-items: center;
                padding: 14px 20px;
                border-bottom: 1px solid var(--border);
                transition: background 0.1s;
                cursor: pointer;
                gap: 14px;
            }
            .data-item:hover {
                background: var(--accent);
            }
            .rec-checkbox {
                appearance: none;
                width: 16px;
                height: 16px;
                border: 1px solid var(--border);
                border-radius: 4px;
                background: #000;
                cursor: pointer;
                display: grid;
                place-content: center;
                flex-shrink: 0;
            }
            .rec-checkbox:checked {
                background: var(--primary);
                border-color: var(--primary);
            }
            .rec-checkbox:checked::before {
                content: "✔";
                color: #000;
                font-size: 10px;
            }
            .item-body {
                flex: 1;
                min-width: 0;
            }
            .item-title {
                font-weight: 500;
                font-size: 14px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                margin-bottom: 2px;
            }
            .item-meta {
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 11px;
                color: var(--muted-fg);
            }
            .item-url {
                font-family: var(--font-mono);
                opacity: 0.5;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                max-width: 300px;
            }
            .item-actions {
                display: flex;
                align-items: center;
                gap: 12px;
            }
            .badge {
                padding: 1px 8px;
                border-radius: 4px;
                background: var(--muted);
                border: 1px solid var(--border);
                font-size: 10px;
                font-family: var(--font-mono);
                color: var(--muted-fg);
            }
            .btn-pin-text {
                padding: 4px 10px;
                border-radius: 6px;
                border: 1px solid var(--border);
                font-size: 11px;
                font-weight: 600;
                font-family: var(--font-mono);
                cursor: pointer;
                color: var(--muted-fg);
                transition: 0.2s;
            }
            .btn-pin-text.on {
                border-color: var(--warning);
                color: var(--warning);
                background: rgba(245, 158, 11, 0.1);
            }
            .score-group {
                display: flex;
                align-items: center;
                background: var(--muted);
                border-radius: 6px;
                padding: 2px;
            }
            .score-btn {
                background: none;
                border: none;
                color: var(--muted-fg);
                cursor: pointer;
                padding: 0 6px;
                font-size: 14px;
            }
            .score-val {
                min-width: 24px;
                text-align: center;
                font-family: var(--font-mono);
                font-size: 11px;
                color: var(--warning);
            }

            /* --- Settings --- */
            .settings-grid {
                display: flex;
                flex-direction: column;
                gap: 32px;
                max-width: 800px;
            }
            .setting-section {
                display: flex;
                flex-direction: column;
                gap: 16px;
            }
            .setting-header {
                font-size: 16px;
                font-weight: 600;
                border-bottom: 1px solid var(--border);
                padding-bottom: 8px;
            }
            .form-row {
                display: flex;
                gap: 12px;
            }
            .input {
                background: #000;
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 8px 12px;
                color: #fff;
                outline: none;
                font-size: 13px;
                font-family: var(--font-mono);
                flex: 1;
            }
            .btn {
                padding: 8px 16px;
                border-radius: var(--radius);
                font-size: 13px;
                font-weight: 600;
                cursor: pointer;
                border: 1px solid var(--border);
                transition: 0.2s;
                background: var(--primary);
                color: var(--primary-fg);
            }
            .btn-ghost {
                background: transparent;
                color: var(--muted-fg);
            }
            .btn-danger {
                color: var(--danger);
                border-color: rgba(239, 68, 68, 0.2);
                background: transparent;
            }
            .btn-danger:hover {
                background: var(--danger);
                color: #fff;
            }

            /* --- Toast --- */
            #toast {
                position: fixed;
                bottom: 24px;
                right: 24px;
                padding: 12px 20px;
                background: #18181b;
                border: 1px solid var(--border);
                border-radius: var(--radius);
                font-size: 13px;
                transform: translateY(100px);
                transition: 0.3s;
                z-index: 100;
            }
            #toast.show {
                transform: translateY(0);
            }
        </style>
    </head>
    <body>
        <nav class="sidebar">
            <div class="logo">
                <svg
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                >
                    <path
                        d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"
                    />
                </svg>
                Site Tracker Agent
            </div>
            <div class="nav-menu">
                <div class="nav-item active" data-target="overview">
                    <svg
                        width="16"
                        height="16"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <rect x="3" y="3" width="7" height="7" />
                        <rect x="14" y="3" width="7" height="7" />
                        <rect x="14" y="14" width="7" height="7" />
                        <rect x="3" y="14" width="7" height="7" /></svg
                    >总览
                </div>
                <div class="nav-item" data-target="history">
                    <svg
                        width="16"
                        height="16"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <polyline
                            points="22 12 18 12 15 21 9 3 6 12 2 12"
                        /></svg
                    >监控历史
                </div>
                <div class="nav-item" data-target="ai-agent" style="color: #a855f7;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
                        AI 智能助理
                      </div>
                      <div class="nav-item" data-target="settings">
                <div class="nav-item" data-target="settings">
                    <svg
                        width="16"
                        height="16"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <circle cx="12" cy="12" r="3" />
                        <path
                            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
                        /></svg
                    >设置
                </div>
            </div>
            <div class="ws-status">
                <div class="ws-dot" id="wsDot"></div>
                <span id="wsStatusText">OFFLINE</span>
            </div>
        </nav>

        <main class="main-content">
            <div id="overview" class="tab-panel active">
                <h2>总览</h2>
                <div class="grid-metrics">
                    <div class="card">
                        <div class="metric-title">总记录数</div>
                        <div class="metric-value" id="statTotal">0</div>
                    </div>
                    <div class="card">
                        <div class="metric-title">今日捕获</div>
                        <div class="metric-value" id="statToday">0</div>
                    </div>
                    <div class="card">
                        <div class="metric-title">监控站点</div>
                        <div class="metric-value" id="statSites">0</div>
                    </div>
                    <div class="card">
                        <div class="metric-title">最常访问</div>
                        <div
                            class="metric-value"
                            id="statTopSite"
                            style="font-size: 16px"
                        >
                            -
                        </div>
                    </div>
                </div>
            </div>

            <div id="history" class="tab-panel">
                <h2>监控的历史</h2>
                <div class="toolbar">
                    <input
                        type="text"
                        class="search-input"
                        id="searchInput"
                        placeholder="搜索标题、URL、或番号..."
                    />
                    <button
                        id="btnBatchDelete"
                        class="btn btn-danger"
                        style="display: none"
                    >
                        删除选中 (0)
                    </button>
                </div>
                <div class="filter-bar" id="filterBar">
                    <div class="filter-chip active" data-domain="all">全部</div>
                    <div class="filter-chip" data-domain="pinned">★ 已收藏</div>
                </div>
                <div class="data-list" id="recordsContainer"></div>
                <div
                    id="loadMoreContainer"
                    style="padding: 20px; text-align: center"
                ></div>
            </div>

            <div id="ai-agent" class="tab-panel">
                  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                    <h2>AI 智能助理</h2>
                    <button class="btn" id="btnRunAgent" style="background: linear-gradient(135deg, #6366f1, #a855f7); border: none; color: #fff;">
                      唤醒 Agent 分析
                    </button>
                  </div>

                  <div class="card" style="margin-bottom: 32px; border-color: rgba(168, 85, 247, 0.3); background: linear-gradient(180deg, rgba(168, 85, 247, 0.05) 0%, #000 100%);">
                    <div class="setting-header" style="color: #c084fc; border-bottom-color: rgba(168, 85, 247, 0.2);">您的专属数字画像</div>
                    <p id="aiProfileText" style="color: var(--muted-fg); margin-top: 16px; line-height: 1.6; font-size: 13px;">
                      Agent 正在沉睡。点击右上角按钮，允许 Agent 读取您本地的高分记录并生成口味分析报告...
                    </p>
                    <div id="aiTags" style="margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap;"></div>
                  </div>

                  <div style="margin-bottom: 12px; display: flex; align-items: center; gap: 8px;">
                    <h3 style="font-size: 16px; font-weight: 600;">Agent 推荐流</h3>
                    <span class="badge" style="background: rgba(168,85,247,0.1); color: #c084fc; border: none;">基于大模型推演</span>
                  </div>

                  <div class="data-list" id="recommendationsContainer">
                    <div style="padding:40px; text-align:center; color:var(--muted-fg);">暂无推荐内容</div>
                  </div>
                </div>
                

            <div id="settings" class="tab-panel">
                <h2>设置</h2>
                <div class="settings-grid">
                    <div class="setting-section card">
                        <div class="setting-header">全局开关</div>
                        <div
                            style="
                                display: flex;
                                align-items: center;
                                gap: 12px;
                            "
                        >
                            <span id="toggleLabel">追踪开启中</span>
                            <input
                                type="checkbox"
                                id="enabledToggle"
                                checked
                                style="width: 20px; height: 20px"
                            />
                        </div>
                    </div>
                    <div class="setting-section card">
                        <div class="setting-header">添加监控组</div>
                        <div class="form-row">
                            <input
                                type="text"
                                id="inputDomain"
                                class="input"
                                placeholder="域名 (e.g. 123.com)"
                            />
                            <input
                                type="text"
                                id="inputLabel"
                                class="input"
                                placeholder="备注分组 (伪装组)"
                            />
                            <input
                                type="color"
                                id="inputColor"
                                value="#5b8dee"
                                style="
                                    width: 40px;
                                    height: 38px;
                                    border: none;
                                    background: none;
                                    cursor: pointer;
                                "
                            />
                        </div>
                        <div class="form-row">
                            <select
                                id="inputRegexTarget"
                                class="input"
                                style="flex: 0.4"
                            >
                                <option value="url">匹配 URL</option>
                                <option value="title">匹配标题</option>
                            </select>
                            <input
                                type="text"
                                id="inputRegexFilter"
                                class="input"
                                placeholder="正则过滤规则 (可选)"
                            />
                            <button class="btn" id="btnAdd">添加站点</button>
                        </div>
                    </div>
                    <div class="setting-section card">
                        <div class="setting-header">已监控列表</div>
                        <div
                            id="watchlist"
                            style="
                                display: flex;
                                flex-direction: column;
                                gap: 8px;
                            "
                        ></div>
                    </div>
                    <div
                        class="setting-section"
                        style="flex-direction: row; gap: 12px"
                    >
                        <button class="btn btn-ghost" id="btnExport">
                            导出 JSON 数据
                        </button>
                        <button class="btn btn-danger" id="btnClear">
                            清空所有历史记录
                        </button>
                    </div>
                </div>
            </div>
        </main>
        <div id="toast"></div>
        <script src="renderer.js"></script>
    </body>
</html>
