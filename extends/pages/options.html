<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site History Tracker · 设置</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0f14;
      --surface: #161921;
      --surface2: #1e2230;
      --border: #2a2f42;
      --accent: #5b8dee;
      --accent2: #e85d8a;
      --text: #e4e8f5;
      --text2: #7a80a0;
      --success: #52c97a;
      --warning: #f5a623;
      --danger: #e85d5d;
      --mono: 'JetBrains Mono', monospace;
      --sans: 'Noto Sans SC', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      line-height: 1.6;
    }

    .layout {
      max-width: 860px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 48px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .logo-text h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .logo-text p {
      font-size: 12px;
      color: var(--text2);
      font-family: var(--mono);
    }

    /* Toggle Switch */
    .toggle-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--text2);
    }

    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
    }

    .toggle input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      inset: 0;
      background: var(--border);
      border-radius: 24px;
      cursor: pointer;
      transition: 0.25s;
    }

    .slider::before {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      left: 3px;
      top: 3px;
      background: white;
      border-radius: 50%;
      transition: 0.25s;
    }

    input:checked + .slider { background: var(--accent); }
    input:checked + .slider::before { transform: translateX(20px); }

    /* Section */
    .section {
      margin-bottom: 40px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--text2);
      font-family: var(--mono);
    }

    /* Add Domain Form */
    .add-form {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 160px 80px auto;
      gap: 10px;
      align-items: end;
    }

    .field label {
      display: block;
      font-size: 11px;
      color: var(--text2);
      font-family: var(--mono);
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .field input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    .field input:focus {
      border-color: var(--accent);
    }

    .color-field input[type="color"] {
      width: 100%;
      height: 37px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      cursor: pointer;
      padding: 2px 4px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      font-family: var(--sans);
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:hover { background: #7aa5f5; transform: translateY(-1px); }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
      padding: 5px 10px;
      font-size: 12px;
    }

    .btn-danger:hover { background: var(--danger); color: white; }

    .btn-ghost {
      background: transparent;
      color: var(--text2);
      border: 1px solid var(--border);
    }

    .btn-ghost:hover { border-color: var(--text2); color: var(--text); }

    /* Watchlist */
    .watchlist {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .watch-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: border-color 0.2s;
    }

    .watch-item:hover { border-color: var(--accent); }

    .color-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .watch-domain {
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 600;
      flex: 1;
    }

    .watch-label {
      font-size: 12px;
      color: var(--text2);
      background: var(--surface2);
      padding: 3px 8px;
      border-radius: 4px;
    }

    .watch-count {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--accent);
      min-width: 60px;
      text-align: right;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--text2);
      font-size: 14px;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 14px;
    }

    /* Stats bar */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
    }

    .stat-value {
      font-family: var(--mono);
      font-size: 28px;
      font-weight: 600;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 12px;
      color: var(--text2);
    }

    /* Export / Danger Zone */
    .action-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-export {
      background: var(--surface);
      color: var(--success);
      border: 1px solid var(--success);
    }

    .btn-export:hover { background: var(--success); color: #0d0f14; }

    .btn-clear {
      background: var(--surface);
      color: var(--danger);
      border: 1px solid var(--danger);
    }

    .btn-clear:hover { background: var(--danger); color: white; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
      transform: translateY(80px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 999;
    }

    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { border-color: var(--success); color: var(--success); }
    .toast.error { border-color: var(--danger); color: var(--danger); }

    @media (max-width: 600px) {
      .form-row { grid-template-columns: 1fr 1fr; }
      .form-row .color-field, .form-row .btn-primary { grid-column: span 1; }
      .stats-bar { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <header>
      <div class="logo">
        <div class="logo-icon">📡</div>
        <div class="logo-text">
          <h1>Site History Tracker</h1>
          <p>浏览记录追踪器 · 设置</p>
        </div>
      </div>
      <div class="toggle-wrap">
        <span id="toggleLabel">追踪中</span>
        <label class="toggle">
          <input type="checkbox" id="enabledToggle" checked>
          <span class="slider"></span>
        </label>
      </div>
    </header>

    <!-- Stats -->
    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-value" id="statTotal">0</div>
        <div class="stat-label">总记录数</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statSites">0</div>
        <div class="stat-label">追踪站点数</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statToday">0</div>
        <div class="stat-label">今日记录</div>
      </div>
    </div>

    <!-- Watchlist Management -->
    <div class="section">
      <div class="section-header">
        <div class="section-title">追踪站点配置</div>
      </div>

      <div class="add-form">
        <div class="form-row">
          <div class="field">
            <label>域名 DOMAIN</label>
            <input type="text" id="inputDomain" placeholder="bilibili.com" />
          </div>
          <div class="field">
            <label>备注 LABEL</label>
            <input type="text" id="inputLabel" placeholder="B站" />
          </div>
          <div class="field color-field">
            <label>颜色 COLOR</label>
            <input type="color" id="inputColor" value="#5b8dee" />
          </div>
          <div class="field">
            <label>&nbsp;</label>
            <button class="btn btn-primary" id="btnAdd">+ 添加</button>
          </div>
        </div>
      </div>

      <div class="watchlist" id="watchlist">
        <div class="empty-state">暂无追踪站点，请在上方添加</div>
      </div>
    </div>

    <!-- Data Management -->
    <div class="section">
      <div class="section-header">
        <div class="section-title">数据管理</div>
      </div>
      <div class="action-row">
        <button class="btn btn-export" id="btnExport">⬇ 导出 JSON</button>
        <button class="btn btn-clear" id="btnClear">🗑 清空所有记录</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="options.js"></script>
</body>
</html>
